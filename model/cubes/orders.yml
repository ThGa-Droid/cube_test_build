cubes:
  - name: orders
    sql_table: public.orders
    public: false

    joins:
      - name: customers
        sql: "{CUBE}.o_custkey = {customers.customer_key}"
        relationship: many_to_one

    dimensions:
      - name: order_key
        sql: "{CUBE}.o_orderkey"
        type: number
        primary_key: true

      - name: customer_key
        sql: "{CUBE}.o_custkey"
        type: number
        
      - name: order_status
        sql: "{CUBE}.o_orderstatus"
        type: string
        
      - name: total_price
        sql: "{CUBE}.o_totalprice"
        type: number
        
      - name: order_date
        sql: "{CUBE}.o_orderdate"
        type: time
        
      - name: order_priority
        sql: "{CUBE}.o_orderpriority"
        type: string
        
      - name: clerk
        sql: "{CUBE}.o_clerk"
        type: string
        
      - name: ship_priority
        sql: "{CUBE}.o_shippriority"
        type: number
        
      - name: comment
        sql: "{CUBE}.o_comment"
        type: string

    measures:
      - name: count
        type: count
        
      - name: total_order_value
        sql: total_price
        type: sum
        
      - name: average_order_value
        sql: total_price
        type: avg
        
      - name: max_order_value
        sql: total_price
        type: max
        
      - name: min_order_value
        sql: total_price
        type: min
